<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX Game</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>HEX</h1>
            <p class="subtitle">Connect your sides to win</p>
        </header>

        <div class="game-info">
            <div class="player-indicator player-1">
                <div class="player-stone red"></div>
                <span class="player-label">Player 1 (Red)</span>
                <span class="player-goal">Connect Top ↔ Bottom</span>
            </div>
            <div class="turn-indicator">
                <span class="turn-text">Current Turn</span>
                <div class="current-player-stone"></div>
            </div>
            <div class="player-indicator player-2">
                <div class="player-stone blue"></div>
                <span class="player-label">Player 2 (Blue)</span>
                <span class="player-goal">Connect Left ↔ Right</span>
            </div>
        </div>

        <div class="board-wrapper">
            <div class="board-container">
                <!-- Corner labels -->
                <div class="corner-label top-left">Red</div>
                <div class="corner-label top-right">Blue</div>
                <div class="corner-label bottom-left">Blue</div>
                <div class="corner-label bottom-right">Red</div>

                <!-- SVG board will be inserted here by JavaScript -->
                <svg id="hex-board" class="hex-board"></svg>
            </div>
        </div>

        <div class="game-controls">
            <button id="new-game" class="btn btn-primary">New Game</button>
            <div class="board-size-control">
                <label for="board-size">Board Size:</label>
                <select id="board-size">
                    <option value="7">7 × 7</option>
                    <option value="9">9 × 9</option>
                    <option value="11" selected>11 × 11</option>
                    <option value="13">13 × 13</option>
                    <option value="14">14 × 14</option>
                    <option value="19">19 × 19</option>
                </select>
            </div>
        </div>

        <div id="winner-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="winner-text">Player Wins!</h2>
                <button id="play-again" class="btn btn-primary">Play Again</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
